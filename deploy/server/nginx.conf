# 80 番（CloudFront から届く）で受け、画面と API の両方を Next.js（127.0.0.1:3000）へ渡す
# EC2 の /etc/nginx/conf.d/events.conf に置く。default_server なので nginx.conf の既定の server より優先される
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # ビルドで作られる JS・CSS は nginx が直接返す。ファイル名に中身のハッシュが入っているので、ずっとキャッシュしてよい。
    # 前のデプロイのファイルも残しておき、デプロイの前に開いた画面が古いファイルを読みに来ても 404 にしない（deploy.sh）
    location /_next/static/ {
        alias /opt/events/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ブラウザと CloudFront の間は HTTPS だけにしている
        proxy_set_header X-Forwarded-Proto https;
        # 画面は DB を読むところを後から流して表示する（Suspense のストリーミング）ので、ためずにすぐ返す
        proxy_buffering off;
    }
}
